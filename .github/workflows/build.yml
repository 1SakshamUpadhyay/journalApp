
name: JournalApp CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend Build and Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: journalApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: journalApp/pom.xml

      - name: Give Maven wrapper permission
        run: chmod +x mvnw

      - name: Build and test backend
        run: ./mvnw -B clean verify
        env:
          SPRING_PROFILES_ACTIVE: test

          MONGODB_URI: mongodb://localhost:27017/journalapp_test
          REDIS_URL: redis://localhost:6379

          JWT_SECRET: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          WEATHER_API_KEY: test-weather-api-key

          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret

          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test-password

          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          KAFKA_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="test" password="test";'

          RESEND_API_KEY: re_test_dummy
          RESEND_FROM_EMAIL: test@example.com

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build